[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issuepilot"
version = "0.1.0"
description = "Classify GitHub issues into standardized categories using machine learning."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "scikit-learn",
    "joblib",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]